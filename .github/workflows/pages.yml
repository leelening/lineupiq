name: Build & deploy LineupIQ site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Contest mode (blank = auto)"
        type: choice
        options: ["", "Captain", "Classic"]
        default: ""
      draft_group:
        description: "Draft group ID (blank = auto)"
        default: ""
  schedule:
    # 10:00 and 17:00 ET (14:00 / 21:00 UTC) — refresh once slates post, again before tip-off.
    - cron: "0 14,21 * * *"

permissions:
  contents: write   # commit history.csv back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cancel mid-commit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history → optimizer version = commits touching main.py

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Review past lineups, solve today's, write site data
        run: |
          ARGS=""
          [ -n "${{ inputs.mode }}" ] && ARGS="$ARGS --mode ${{ inputs.mode }}"
          [ -n "${{ inputs.draft_group }}" ] && ARGS="$ARGS --draft-group ${{ inputs.draft_group }}"
          uv run site/build.py --out _site $ARGS

      - name: Commit updated history.csv
        run: |
          if git diff --quiet -- history.csv; then
            echo "history.csv unchanged"; exit 0
          fi
          git config user.name  "Lening Li"
          git config user.email "8867086+leelening@users.noreply.github.com"
          git add history.csv
          git commit -m "Update lineup history ($(date -u +%F)) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Assemble site
        run: cp site/index.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
