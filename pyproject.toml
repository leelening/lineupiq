[project]
name = "lineupiq"
version = "0.1.0"
description = "DraftKings NBA lineup optimizer (Classic and Showdown) using mixed-integer programming"
authors = [{ name = "Lening Li" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas",
    "mip",
    "tabulate",
    "requests",
    "nba_api",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
